name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Manual re-run, for backfilling assets onto a release whose build never
  # fired. Dispatch from main; the jobs check out the tag named below.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build packages for (e.g. v0.1.5)"
        required: true

permissions:
  contents: write

env:
  # A tag push supplies this via the ref; a manual re-run supplies it as input.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build .deb
        run: cargo deb

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG }}
          files: target/debian/*.deb

  rpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build .rpm
        run: cargo generate-rpm

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG }}
          files: target/generate-rpm/*.rpm

  pacman:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed rust openssh

      - name: Set package version from tag
        run: |
          version="${TAG#v}"
          sed -i "s/^pkgver=.*/pkgver=${version}/" PKGBUILD

      - name: Build package as non-root user
        run: |
          useradd -m builder
          chown -R builder:builder .
          su builder -c "makepkg -f --noconfirm"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG }}
          files: "*.pkg.tar.zst"
